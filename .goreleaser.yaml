# GoReleaser config for caldensec.
# Cross-compiles the dependency-free static binary (the skills pack ships inside
# it via go:embed) and publishes per-platform archives + checksums to a GitHub
# release on every pushed tag (see .github/workflows/release.yml).
#
# Local dry run (no publish):  goreleaser release --snapshot --clean
version: 2

project_name: caldensec

before:
  hooks:
    - go mod tidy

builds:
  - id: caldensec
    main: .
    binary: caldensec
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}

archives:
  - id: caldensec
    # install.sh predicts this exact name: caldensec_<os>_<arch>.tar.gz, with
    # "darwin" shown as "mac". Contents are wrapped in a top-level "caldensec/"
    # folder so extracting never dumps files into the current directory.
    name_template: '{{ .ProjectName }}_{{ if eq .Os "darwin" }}mac{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'
    wrap_in_directory: "{{ .ProjectName }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: ficopix
    name: caldensec
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
