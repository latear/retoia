# GoReleaser config for retoia.
# Cross-compiles the dependency-free static binary and publishes per-platform
# archives + checksums to a GitHub release on every pushed tag (see
# .github/workflows/release.yml).
#
# Local dry run (no publish):  goreleaser release --snapshot --clean
version: 2

project_name: retoia

before:
  hooks:
    - go mod tidy

builds:
  - id: retoia
    main: .
    binary: retoia
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}

archives:
  - id: retoia
    # install.sh predicts this exact name: retoia_<os>_<arch>.tar.gz, with
    # "darwin" shown as "mac". Contents are wrapped in a top-level "retoia/"
    # folder so extracting never dumps files into the current directory.
    name_template: '{{ .ProjectName }}_{{ if eq .Os "darwin" }}mac{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'
    wrap_in_directory: "{{ .ProjectName }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

release:
  github:
    owner: latear
    name: retoia
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
